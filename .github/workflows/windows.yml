name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build HUB and run offline checks
        shell: cmd
        run: build.cmd
      - name: Validate offline backup and source-protocol codecs
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build production Vue interface and Windows host
        shell: powershell
        run: .\tools\build-vue-hub.ps1
      - name: Package own applications
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FURYCUBE-G9-PRO-HUB-Windows-x64
          path: |
            bin/FURYCUBE-G9-PRO-HUB.exe
            bin/G9Device.exe
            bin/Microsoft.Web.WebView2.Core.dll
            bin/Microsoft.Web.WebView2.WinForms.dll
            bin/WebView2Loader.dll
            bin/WebView2-LICENSE.txt
            frontend/dist/
            Run-Hub.cmd
            README.md
            PLAN.md
            docs/
            examples/
            firmware/OLED-PROTOCOL.md
            LICENSE
          if-no-files-found: error
